# Kitui 2027 — every assumption the pipeline makes.
#
# Rule: nothing numeric that is not a published figure may be hard-coded in a module.
# It belongs here, with a rationale and a status.
#
#   status: CONFIRMED   — a published figure from a named source, or a definition that
#                         follows from one. Carries source_id and tier.
#   status: PLACEHOLDER — nobody has confirmed this. Firefly chose it to let a model run.
#                         Every report states this beside the result.
#
# Compiled against the data pack of 16 September 2026.

meta:
  as_of: "2026-09-16"
  pack_compiled: "2026-09-16"
  currency: KES
  language: en-GB

# Fixed seed for every stochastic step in the pipeline. Never override in a module.
seed: 20270809   # Kenya's 2027 general election date, used as an arbitrary fixed constant.

# ---------------------------------------------------------------------------------------
# 1. The register
# ---------------------------------------------------------------------------------------
register:
  y2022:
    value: 532758
    unit: voters
    source_id: S2
    tier: 1
    as_of: "2022"
    status: CONFIRMED
    rationale: >-
      IEBC registered voters per county, 2022. Ward breakdown [S1] sums to this figure and
      is independently reproduced by the site's own data/ward-register.json. This is the
      only register figure in the pack with a T1 source.
  y2022_with_prisons:
    value: 532833
    unit: voters
    source_id: S1
    tier: 1
    as_of: "2022"
    status: CONFIRMED
    rationale: 532,758 ward register + 75 prison voters. Prison voters sit in no ward.
  y2026_july:
    value: 605703
    unit: voters
    source_id: S4
    tier: 3
    as_of: "2026-07"
    status: PLACEHOLDER
    verify: true
    rationale: >-
      Kitui's total registered voters as at July 2026, as reported by Venas News [S4], a T3
      aggregator. Every output using it is labelled "verify". Downgraded on 25 September 2026:
      from 17 September this entry recorded the figure as Tier 1, read off the IEBC ECVR county
      annex [S3], but [S3] is IEBC's April release on the drive and cannot carry a July total,
      and no IEBC document giving the July total is in hand. The value is unchanged and Stage
      3's 37.2% benchmark is still computed against it, as a reported figure, not an official
      one. The T1 source is IEBC's county register as at July 2026.
  y2026_new_registrations:
    value: 61839
    unit: voters
    source_id: S3
    tier: 1
    as_of: "2026-04-28"
    status: CONFIRMED
    verify: false
    rationale: >-
      New voters added in Kitui during the 30-day Enhanced Continuous Voter Registration
      drive that ended 28 April 2026, confirmed against the IEBC annex [S3].
      This figure and the 605,703 total measure DIFFERENT WINDOWS, and treating them as
      contradictory was an error in this file's earlier reading. 605,703 minus 532,758 is
      72,945 of total growth since 2022, of which 61,839 came from the 30-day drive. The
      remaining 11,106 is ordinary continuous registration outside that window:
      constituency-based continuous registration opened on 29 September 2025, six months
      before the drive, and the 605,703 total is dated July, three months after it closed.
      The two figures are complementary, not in conflict.
  y2026_growth_outside_the_drive:
    value: 11106
    unit: voters
    source_id: S4
    tier: 3
    as_of: "2026-07"
    status: PLACEHOLDER
    verify: true
    method: calculated
    rationale: >-
      605,703 minus 532,758 minus 61,839. Continuous registration outside the 30-day ECVR
      window, which opened on 29 September 2025 and continued after 28 April 2026. Derived,
      not reported, and no firmer than its least certain input: the 605,703 total is T3
      [S4], so this residue is T3 and verify too.
  y2026_uniform_scale_factor:
    value: 1.1369
    status: PLACEHOLDER
    rationale: >-
      605,703 / 532,758 = 1.1369. Used ONLY to project the 2022 ward register onto the
      2026 county total so the simulation can report against both register figures.
      It is known to be wrong in detail: the 2026 ECVR drive was ward-based, so growth
      was uneven, and applying one factor to every ward assumes it was not. It is used
      because the alternative — inventing a per-ward growth pattern — would be worse.
      Every figure derived from it is labelled modelled and verify. Delete this the day
      the IEBC ward annex arrives.
  by_ward_2026:
    value: null
    status: PLACEHOLDER
    rationale: >-
      [DATA NEEDED] The 2026 register by ward. The ECVR drive was ward-based, so growth is
      uneven and cannot be distributed pro rata without inventing data. Registration growth
      is therefore dropped from the Stage 4 index until the IEBC annex arrives.

# ---------------------------------------------------------------------------------------
# 2. Election benchmarks (Stage 3). There is NO 50% threshold — most votes wins.
# ---------------------------------------------------------------------------------------
benchmarks:
  winning_tally_2022:
    value: 198004
    unit: votes
    source_id: S11
    tier: 2
    as_of: "2022-08"
    status: CONFIRMED
    rationale: Malombe's certified 2022 winning gubernatorial tally. Benchmark (a).
  winner_share_of_register_2022:
    value: 0.372
    unit: share
    source_id: S11
    tier: 2
    as_of: "2022-08"
    status: CONFIRMED
    method: calculated
    rationale: >-
      198,004 / 532,758 = 37.17%. Benchmark (b): applied to each register figure in turn.
      On the 2022 register this reproduces 198,004; on 605,703 [VERIFY] it gives ~225,300.
      This is a ratio carried forward, not a forecast of what a 2027 win requires.
  no_fixed_threshold:
    value: true
    status: CONFIRMED
    rationale: >-
      Kenyan governor races are won by plurality. Modelling a fixed 50% win condition would
      be wrong. The simulation reports benchmark comparisons only.

# ---------------------------------------------------------------------------------------
# 3. Turnout and support ranges (Stage 3). All PLACEHOLDER — no ward-level data exists.
# ---------------------------------------------------------------------------------------
turnout:
  ward_low:
    value: 0.55
    status: PLACEHOLDER
    rationale: >-
      Lower bound of the per-ward turnout draw. The site's §3.4.1 asserts a ~62% county
      average; the pack supplies no turnout figure at all and no ward-level turnout exists
      ([DATA NEEDED], pack §3.5 — Forms 34A are the route). This range brackets 62% widely
      enough to carry the uncertainty rather than hide it.
  ward_high:
    value: 0.72
    status: PLACEHOLDER
    rationale: Upper bound of the per-ward turnout draw. See ward_low.
  ward_dispersion:
    value: 0.06
    status: PLACEHOLDER
    rationale: >-
      Plus or minus 6 percentage points of ward-level variation around the county turnout
      drawn for each scenario. Turnout is drawn once per draw for the whole county and
      then varied by ward, rather than independently per ward. Independent ward draws
      average out across 40 wards and collapse the county distribution to a
      near-certainty, which is a modelling artefact, not a finding: a high-turnout year
      is high across the county. This structure keeps the county-level uncertainty the
      ranges are meant to express.
  distribution:
    value: uniform
    status: PLACEHOLDER
    rationale: >-
      Uniform, not normal. With no ward-level turnout data there is no basis for claiming a
      central tendency, and a uniform draw does not pretend to one.

support:
  # One scenario, anchored on an official result: what the 2022 winner took. Firefly works
  # from existing records and its own analysis only, so no support range is taken from a
  # measure of opinion.
  competitive_ward_low:
    value: 0.40
    status: PLACEHOLDER
    rationale: >-
      Lower bound for the competitive general-election scenario, as a share of ballots
      cast in the ward. Anchored on 2022: Malombe took roughly 60% of the votes cast for
      the four named governor candidates [CALC, pack section 2.3], and the runner-up took
      about 35%. A candidate who consolidates the field but does not dominate it sits
      near 40%. This is a scenario input, not a projection of his support.
  competitive_ward_high:
    value: 0.60
    status: PLACEHOLDER
    rationale: >-
      Upper bound for the competitive scenario: the share the 2022 winner actually
      achieved. Using the observed winning share as the ceiling keeps the scenario inside
      what this county has been seen to do, rather than inventing a landslide.
  ward_dispersion:
    value: 0.05
    status: PLACEHOLDER
    rationale: >-
      Plus or minus 5 percentage points of ward-level variation around the countywide
      support drawn for each draw. Same reasoning as turnout.ward_dispersion: a
      candidate's countywide standing moves together, and independent ward draws would
      manufacture false precision in the county total.
  home_advantage_multiplier:
    value: 1.35
    applies_to: Kitui Central
    status: PLACEHOLDER
    rationale: >-
      Multiplier on the drawn share in his home constituency's five wards. He has been its
      MP since 2013 [S18]. No measured home-ward support figure exists anywhere in the
      pack, so this is a judgement number, not evidence. Stage 3's tornado chart shows how
      much the result moves with it — treat that sensitivity as the real output.
  mwingi_narrative_multiplier:
    value: 1.00
    applies_to: Mwingi bloc
    status: PLACEHOLDER
    rationale: >-
      Set to 1.00 deliberately, i.e. no effect. The "Kavaa Makali" narrative is reported to
      be gaining traction in Mwingi [S30], but that is a single T3 outlet with no measured
      support figure. Encoding it as an uplift would convert an anecdote into arithmetic.
      Left at parity until an official record (2022 ward results, Forms 37A/37B) shows it.

simulation:
  n_draws:
    value: 10000
    status: CONFIRMED
    rationale: Specified by the brief. With a fixed seed this is exactly reproducible.
  label:
    value: "Scenario model, not a forecast."
    status: CONFIRMED
    rationale: Required on every Stage 3 output.

rivals:
  model_rivals:
    value: false
    status: PLACEHOLDER
    rationale: >-
      No rival vote ranges have been supplied. While this is false, Stage 3 reports
      benchmark comparisons and explicitly states it is NOT a win probability. To enable,
      set true and add per-rival ranges below; the report then changes its own language.
  ranges: {}

# ---------------------------------------------------------------------------------------
# 4. Ward priority index (Stage 4)
# ---------------------------------------------------------------------------------------
# Weights must sum to 1.0 across features that are actually available. Features with no
# data are dropped and listed — never imputed — and the remaining weights are renormalised,
# with the renormalisation stated in the report.
index_weights:
  registered_voters:
    value: 0.30
    status: PLACEHOLDER
    rationale: Raw electoral weight. The only feature with complete T1 data today.
  registration_growth:
    value: 0.15
    status: PLACEHOLDER
    rationale: Requires the 2026 register by ward. [DATA NEEDED] — currently dropped.
  connectivity:
    value: 0.10
    status: PLACEHOLDER
    rationale: >-
      Channel-mix proxy, not persuasion weight — it says how to reach a ward, not how much
      the ward matters. Requires ward-level coverage data. [DATA NEEDED] (pack gap 20).
  drought_exposure:
    value: 0.10
    status: PLACEHOLDER
    rationale: >-
      Issue-salience proxy. NDMA publishes at county level only in the pack; sub-county
      detail is [DATA NEEDED]. A county-wide constant has zero variance across wards and
      so cannot enter a ward ranking — currently dropped.
  party_strength_2022:
    value: 0.35
    status: PLACEHOLDER
    rationale: >-
      Requires 2022 Forms 37A/37B by ward. [DATA NEEDED] (pack gap 7). Carries the 0.25 the
      retired recognition-gap feature held: that feature needed a voter survey, and Firefly
      works from existing records only. How a ward actually voted in 2022 is the official
      record closest to the question it asked.

sensitivity:
  n_weight_draws:
    value: 1000
    status: CONFIRMED
    rationale: Specified by the brief. Dirichlet perturbation of the weight vector.
  dirichlet_concentration:
    value: 10.0
    status: PLACEHOLDER
    rationale: >-
      Concentration for the Dirichlet draw around the stated weights. 10.0 gives meaningful
      spread without producing degenerate weight vectors. Lower = more aggressive test.
  unstable_rank_range:
    value: 8
    status: PLACEHOLDER
    rationale: >-
      A ward whose rank spans more than 8 places across the 1,000 draws is flagged unstable.
      8 is one fifth of 40 wards — a judgement line, stated so it can be argued with.

clustering:
  min_segments:
    value: 3
    status: CONFIRMED
    rationale: Brief specifies 3–5 segments.
  max_segments:
    value: 5
    status: CONFIRMED
    rationale: Brief specifies 3–5 segments.
  linkage:
    value: ward
    status: CONFIRMED
    rationale: Ward linkage on standardised features, as specified.
  n_wards:
    value: 40
    status: CONFIRMED
    rationale: >-
      Stated beside every cluster result. n = 40 is a small sample: silhouette scores are
      unstable at this size and segment membership should be read as indicative.

# ---------------------------------------------------------------------------------------
# 5. Content pillars (Stage 6 labelling, Stage 10 ranking)
# ---------------------------------------------------------------------------------------
# Derived from the issues the pack evidences, not from the site's messaging section, so that
# Stage 10 ranks pillars against data rather than against the proposal's own prior.
content_pillars:
  status: PLACEHOLDER
  rationale: >-
    Pillar set for auto-labelling untagged posts and comments. Each is anchored to a pack
    figure so Stage 10 can score salience from evidence. Revise once the comment corpus
    exists.
  values:
    - id: water
      label: Water and drought
      evidence: "21% basic drinking water, lowest county in Kenya [S41]; 7.2 km trekking Feb 2026 [S43]"
    - id: poverty
      label: Household economics and poverty
      evidence: "55.2% poverty rate; food is 72.5% of household spend [S40]"
    - id: fiscal
      label: County finance and accountability
      evidence: "KSh 13.79bn FY2026/27 envelope [S47]; the Economist Governor frame"
    - id: allocation
      label: How county money is split between wards
      evidence: "CLIDP equal-ward split vs needs-based allocation [S24]"
    - id: record
      label: Record and delivery
      evidence: "NG-CDF projects [S20]; Budget & Appropriations [S18]. Project records only, never beneficiary lists"
    - id: mui_coal
      label: Mui Basin coal
      evidence: "~400m tonnes; 2023 residents' petition [S52]; 2025 revival [S51]"
    - id: agriculture
      label: Farming and food security
      evidence: "NDMA phases Dec 2025 – Aug 2026 [S43-S46]"
    - id: youth
      label: Youth, jobs and registration
      evidence: "IEBC flagged lagging youth registration, Feb 2026 [S69]"
    - id: campaign
      label: Campaign activity and events
      evidence: "Daily activity updates are the current posting pattern (pack §1.1)"
    - id: other
      label: Other or unclassifiable
      evidence: "Residual. A post landing here is not a pillar failure, it is an untagged post."

labelling:
  in_session_limit:
    value: 300
    status: CONFIRMED
    rationale: Up to ~300 items are labelled in-session in batches; beyond that, the API script.
  low_confidence_threshold:
    value: 0.70
    status: PLACEHOLDER
    rationale: Labels below this confidence are flagged for human review.
  human_review_sample:
    value: 0.20
    status: CONFIRMED
    rationale: >-
      A random 20% of ALL labels goes to human review regardless of confidence, so review
      coverage does not depend on the model's own self-assessment.
  kikamba_always_review:
    value: true
    status: CONFIRMED
    rationale: >-
      Every Kikamba item goes to human review. Off-the-shelf sentiment models do not handle
      Kikamba and their output on it must not be trusted.

# ---------------------------------------------------------------------------------------
# 6. Reach model (Stage 9). Every figure derived here is MODELLED.
# ---------------------------------------------------------------------------------------
reach:
  county_internet_use:
    value: 0.262
    unit: share of persons aged 3+
    source_id: CA-ICT-KHS-2024
    tier: 1
    as_of: "2023-24"
    status: CONFIRMED
    rationale: >-
      Kitui's internet-use rate, read from the ICT Analytical Report on the 2023/24 Kenya
      Housing Survey (Communications Authority with KNBS) and supplied by the campaign on
      17 September 2026. Supersedes the 2019 census rate of 13.6%, which is retained below
      for comparison because the change between them is itself a finding.
      Source: https://www.ca.go.ke/sites/default/files/2025-08/ICT%20Analytical%20Report%20Based%20on%202023-2024%20Kenya%20Housing%20Survey_0.pdf
  county_phone_ownership:
    value: 0.441
    unit: share of persons aged 3+
    source_id: CA-ICT-KHS-2024
    tier: 1
    as_of: "2023-24"
    status: CONFIRMED
    rationale: >-
      Kitui's mobile-phone ownership rate from the same report and the same reading.
      Supersedes the 2019 census rate of 42.9%.
      Note how little it moved: +1.2 points in five years, against +12.6 points for internet
      use. Nearly all the growth in connectivity came from people who already owned a phone
      getting online, not from new phone owners. That is why the SMS-only segment shrinks
      rather than holds.
  county_internet_use_2019:
    value: 0.136
    unit: share of residents aged 3+
    source_id: S35
    tier: 2
    as_of: "2019"
    status: CONFIRMED
    rationale: >-
      KNBS 2019 census: 143,340 of 1,053,991 aged 3+. Superseded as the working rate, kept
      because the proposal's prose is built on it and the gap between the two is a finding
      the campaign needs to see.
  county_phone_ownership_2019:
    value: 0.429
    unit: share of residents aged 3+
    source_id: S35
    tier: 2
    as_of: "2019"
    status: CONFIRMED
    rationale: >-
      KNBS 2019 census: 452,948 owners. Superseded as the working rate, kept for comparison.
  national_rural_phone_ownership:
    value: 0.486
    unit: share aged 3+
    source_id: S36
    tier: 2
    as_of: "2023-24"
    status: CONFIRMED
    rationale: >-
      KNBS Housing Survey 2023/24, rural. No longer needed as a fallback now that Kitui's own
      rates are in hand, and retained only as context: Kitui at 44.1% sits 4.5 points below
      the rural mean.
  national_internet_use:
    value: 0.35
    unit: share
    source_id: S36
    tier: 2
    as_of: "2023-24"
    status: CONFIRMED
    rationale: >-
      KNBS Housing Survey 2023/24, national. Context only. Kitui's 26.2% sits above the 25.0%
      rural mean and well below the 35.0% national rate.
  smartphone_share_of_connections:
    value: 0.597
    unit: share of active SIMs
    source_id: S34
    tier: 2
    as_of: "2025-26 Q3"
    status: CONFIRMED
    method: calculated
    rationale: >-
      CA Q3 FY2025/26: 50.2m smartphones / 84.1m active SIMs = 59.7%. A NATIONAL rate
      applied to a rural county with below-average connectivity, so it almost certainly
      overstates Kitui. Flagged as such on every output.
  denominator_register:
    value: 605703
    unit: voters
    source_id: S4
    tier: 3
    as_of: "2026-07"
    status: PLACEHOLDER
    verify: true
    rationale: >-
      Reach is a statement about today's electorate, so the county totals are computed on the
      July 2026 register as reported by Venas News [S4], not the 2022 one. That figure is T3
      and verify (see register.y2026_july). Ward-level figures still distribute that total
      using 2022 ward shares, because no ward-level 2026 breakdown exists - see
      register.y2026_uniform_scale_factor for why that distribution is known to be wrong in
      detail and used anyway.
  ward_uniformity:
    value: true
    status: PLACEHOLDER
    rationale: >-
      The model applies county rates uniformly across all 40 wards, because no ward-level
      connectivity data exists ([DATA NEEDED], pack gap 20). This is known to be wrong:
      the pack records USO coverage gains in Mwingi North, Mumoni, Ngomeni and Tharaka
      [S35], so rural wards differ from Township. Ward reach figures are therefore a
      county rate applied to a ward denominator, and the report says exactly that.

# ---------------------------------------------------------------------------------------
# 7. Messaging compliance (binds Stages 9-11)
# ---------------------------------------------------------------------------------------
compliance:
  bulk_sms_languages:
    value: [English, Kiswahili]
    source_id: S54
    tier: 2
    status: CONFIRMED
    rationale: >-
      CA/NCIC guidelines limit bulk political SMS to English or Kiswahili. Kikamba is not
      available on the bulk SMS layer — it belongs on radio, WhatsApp voice and in person.
      Any Stage 11 test design proposing Kikamba SMS is non-compliant.
  sms_lodging_hours:
    value: 48
    source_id: S53
    tier: 1
    status: CONFIRMED
    rationale: Bulk political messages lodged with the operator 48 hours before sending.
  send_window_draft:
    value: "08:00-18:00"
    source_id: S55
    tier: 2
    status: PLACEHOLDER
    verify: true
    rationale: A 2020 draft revision proposed this window. [VERIFY] whether it is in force.
  ngcdf_beneficiary_data_usable:
    value: false
    source_id: S57
    tier: 1
    status: CONFIRMED
    rationale: >-
      ODPC 2025 public-sector guidance bars reusing public-programme personal data for
      political mobilisation without explicit consent. Beneficiary lists are off-limits.
      Project records remain usable as proof points.

# ---------------------------------------------------------------------------------------
# 8. Measurement design (Stage 11)
# ---------------------------------------------------------------------------------------
measurement:
  alpha:
    value: 0.05
    status: CONFIRMED
    rationale: Two-sided 95% confidence, the conventional level for the minimum detectable effect.
  power:
    value: 0.80
    status: CONFIRMED
    rationale: Conventional 80% power for the minimum detectable effect calculation.
  baseline_rates:
    value: [0.02, 0.05, 0.10]
    status: PLACEHOLDER
    rationale: >-
      Illustrative baseline response rates for the two-proportion MDE grid. No campaign has
      run yet, so there is no measured baseline. Replaced by the Week 1 audit.
  list_sizes:
    value: [1000, 5000, 10000, 25000, 50000, 100000]
    status: PLACEHOLDER
    rationale: Illustrative SMS list sizes spanning ward-level to countywide sends.
  holdout_share:
    value: 0.15
    status: PLACEHOLDER
    rationale: >-
      Share of wards held out as untreated controls, stratified by constituency. 15% of 40
      is 6 wards. Large enough to read an effect, small enough to cost little reach.
  holdout_is_confidential:
    value: true
    status: CONFIRMED
    rationale: >-
      The holdout assignment must never be published to the site. If rivals or the campaign's
      own team know which wards are controls, the experiment is dead.

# ---------------------------------------------------------------------------------------
# 9. Site export (Stage 12)
# ---------------------------------------------------------------------------------------
site_export:
  never_publish:
    value: [vulnerabilities, rival_analysis, holdout_assignments, nomination_leverage]
    status: CONFIRMED
    rationale: >-
      Stripped before any copy to the site's content folder. The repo is public and the site
      is a public URL. Nomination leverage (no longer produced) stays blocked in case an old
      export resurfaces; holdout assignments destroy the experiment; rival analysis and vulnerability lines are
      internal working material.
  requires_approval:
    value: true
    status: CONFIRMED
    rationale: >-
      Nothing is copied into the site until reports/site_mapping.md is approved. The
      pipeline never edits the site's files on its own.
