name: verify

# WHY THIS EXISTS. `npm run verify` is eleven guards and 38 arithmetic assertions, and several of
# them exist to catch a change nobody meant to make: content-integrity compares every body line
# against a baseline, figure-retention proves no figure left the printed document, find-duplicates
# re-derives the collapsed repetitions from the content. Until this file, all of that ran only when
# somebody remembered to type it, and `main` deploys to Vercel on push.
#
# The build is included deliberately. `npm run verify` does not compile the site, and a type error
# or a bad import would otherwise reach production with every guard green.

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run pointless.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The tests run TypeScript directly through `node --experimental-strip-types`, which needs 22.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Guards and arithmetic
        run: npm run verify

      # The platform-ownership baseline (scripts/preservation-manifest.json): fails if any protected
      # dataset, strategy or tool file is gone, or any record count fell below the baseline.
      - name: Nothing removed
        run: npm run check:preservation

      - name: Build
        run: npm run build
