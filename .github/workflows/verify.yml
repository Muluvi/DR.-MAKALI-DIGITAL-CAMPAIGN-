name: verify

# WHY THIS EXISTS. `npm run verify` is eleven guards and 38 arithmetic assertions, and several of
# them exist to catch a change nobody meant to make: content-integrity compares every body line
# against a baseline, figure-retention proves no figure left the printed document, find-duplicates
# re-derives the collapsed repetitions from the content. Until this file, all of that ran only when
# somebody remembered to type it, and `main` deploys to Vercel on push.
#
# The build is included deliberately. `npm run verify` does not compile the site, and a type error
# or a bad import would otherwise reach production with every guard green.

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run pointless.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # verify-content-integrity.mjs compares against a baseline commit, so it needs history
          # rather than the default single-commit checkout.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 22 is not a preference. `npm run test:figures` runs the TypeScript test file directly
          # through `node --experimental-strip-types`, which needs it.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Guards and arithmetic
        run: npm run verify

      - name: Build
        run: npm run build
