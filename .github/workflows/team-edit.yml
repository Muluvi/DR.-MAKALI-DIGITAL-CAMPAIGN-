name: team edit

# WHY THIS EXISTS. Dr. Mulu's team edits the data pack on the site (/team/data), never in GitHub.
# Each edit arrives here as one commit on its own branch, team-edit/<time>-<what>. This workflow is
# the gate between that commit and the live site: it regenerates the files derived from the data,
# runs every check `npm run verify` runs, the preservation check and the production build, and
# only if all of them pass does it move the edit onto main, which Vercel deploys. An edit that
# fails stays on its branch; the site's change history shows it as refused, with this run's log.

on:
  push:
    branches: ["team-edit/**"]

permissions:
  contents: write

# One edit at a time, in order, so two edits never race onto main.
concurrency:
  group: team-edit
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start from the current main
        run: |
          git config user.name "kitui-platform"
          git config user.email "kitui-platform@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Regenerate derived files
        run: |
          npm run content
          git add -A content data public lib
          git diff --cached --quiet || git commit -m "Regenerate derived files for ${GITHUB_REF_NAME}"

      - name: Guards and arithmetic
        run: npm run verify

      - name: Nothing removed
        run: npm run check:preservation

      - name: Types
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Publish to main
        run: |
          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
          git push origin HEAD:main
